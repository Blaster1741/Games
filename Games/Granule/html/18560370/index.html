<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Loader</title>
    <style>
        /* Make the iframe fill the entire page */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        iframe {
            border: none;   /* remove border */
            width: 100%;    /* full width */
            height: 100%;   /* full height */
        }
    </style>
</head>
<body>

    <!-- 🔹 STEP 1: Set the filename here -->
    <!-- Change "page1.html" to the file you want to load -->
    <iframe src="Granule.html"></iframe>

</body>
</html>
