        height: 100dvh;

        flex-direction: row;
        align-items: stretch;
        
        box-sizing: border-box;
        padding: 0;
        gap: 0;
      }

        flex: 0 0 auto;
        max-height: 100vh;
        max-height: 100dvh;
        overflow: auto;
        display: flex;
        align-items: stretch;
      }
      #app > .col-side.col-right { justify-content: flex-end; }
      
      #app > .col-center {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      
      #app > .col-center > .canvas-host {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      
      .canvas-host canvas { touch-action: none; }
      html, body { overscroll-behavior: none; }

      
      body.touch-mode #app > .col-side.col-left { display: none; }

      body.touch-mode #app > .col-side.col-right { display: none; }
      
      body.touch-mode #app { padding-right: 124px; box-sizing: border-box; }
      
      body.touch-mode .granule-dock canvas { touch-action: pan-y; }
      body.touch-mode .granule-dock > div { -webkit-overflow-scrolling: touch; }

      
      #granule-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        transition: opacity 0.55s ease;
        pointer-events: none;
        user-select: none;
      }
      
      #granule-loader .gl-word {
        width: min(66vw, 560px);
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      
      #granule-loader .gl-bar {
        width: min(260px, 58vw);
        height: 12px;
        box-sizing: border-box;
        border: 1px solid #35302a;
        background: #131110;
        padding: 2px;
      }
      #granule-loader .gl-fill {
        height: 100%;
        width: 0%;
        background: #8b929c; 
        transition: none;
      }
      #granule-loader .gl-status {
        font-family: ui-monospace, Consolas, monospace; 
        font-size: 12px;
        color: #6f665c;
        min-height: 1em;
      }</style>
  </head>
